<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>みんなの掲示板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#1b2530; --muted:#647082;
  --line:#d9dfe6; --accent:#1f6f78; --accent-ink:#ffffff; --accent-soft:#dcedef;
  --danger:#b3392f; --danger-soft:#f8e3e0; --focus:#1f6f78;
  --font-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --font-display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11161c; --surface:#19212a; --surface-2:#1f2832; --ink:#e6ebf0; --muted:#93a0ae;
    --line:#2b3641; --accent:#5fb3bd; --accent-ink:#0c1a1d; --accent-soft:#1b3439;
    --danger:#f08a80; --danger-soft:#3a2321; --focus:#5fb3bd; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11161c; --surface:#19212a; --surface-2:#1f2832; --ink:#e6ebf0; --muted:#93a0ae;
  --line:#2b3641; --accent:#5fb3bd; --accent-ink:#0c1a1d; --accent-soft:#1b3439;
  --danger:#f08a80; --danger-soft:#3a2321; --focus:#5fb3bd; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.7;padding-inline:16px}
.wrap{max-width:1040px;margin-inline:auto;padding-block:24px 48px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
h1{font-family:var(--font-display);font-size:28px;margin:0;letter-spacing:.04em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px}
.notice{background:var(--danger-soft);color:var(--danger);padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:14px}
.notice[hidden]{display:none}
main{display:grid;grid-template-columns:320px minmax(0,1fr);gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.side{display:flex;flex-direction:column;gap:14px}
.list-head{padding:12px 14px;font-size:12px;letter-spacing:.12em;color:var(--muted);border-bottom:1px solid var(--line);font-weight:700}
.threads{list-style:none;margin:0;padding:0}
.threads li+li{border-top:1px solid var(--line)}
.thread-item{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 14px;font:inherit;color:inherit;cursor:pointer;border-left:3px solid transparent}
.thread-item:hover{background:var(--surface-2)}
.thread-item[aria-current="true"]{background:var(--accent-soft);border-left-color:var(--accent)}
.thread-item .t{font-weight:700;display:block;overflow-wrap:anywhere;line-height:1.5}
.thread-item .m{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.empty{padding:18px 14px;color:var(--muted);font-size:14px}
form.compose{padding:14px;display:flex;flex-direction:column;gap:10px}
form.compose h2,.thread-head h2{margin:0}
form.compose h2{font-size:14px;letter-spacing:.06em}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
input[type=text],textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
textarea{min-height:96px;resize:vertical;line-height:1.6}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:6px}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);padding:7px 16px;font-weight:700}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:default}
.ghost{background:none;color:var(--muted);border:1px solid var(--line);padding:2px 10px;font-size:12px;line-height:1.7}
.ghost:hover{color:var(--ink);border-color:var(--muted)}
.ghost.danger:hover,.ghost.danger.armed{color:var(--danger);border-color:var(--danger)}
.ghost.danger.armed{background:var(--danger-soft);font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.thread-view{display:flex;flex-direction:column;gap:14px;min-width:0}
.thread-head{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.thread-head h2{font-family:var(--font-display);font-size:22px;text-wrap:balance;overflow-wrap:anywhere;line-height:1.45}
.back{display:none;align-self:flex-start}
.posts{list-style:none;margin:0;padding:0}
.post{padding:14px 18px}
.post+.post{border-top:1px solid var(--line)}
.post-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;font-size:13px;margin-bottom:6px}
.no{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:700;min-width:2.2em}
.name{font-weight:700;overflow-wrap:anywhere}
.time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.edited{color:var(--muted);font-size:12px}
.actions{margin-left:auto;display:flex;gap:6px}
.body{white-space:pre-wrap;overflow-wrap:anywhere;margin:0;max-width:65ch}
.edit-form{display:flex;flex-direction:column;gap:8px}
.placeholder{padding:48px 18px;text-align:center;color:var(--muted)}
@media (max-width:760px){
  main{grid-template-columns:minmax(0,1fr)}
  main[data-view="list"] .thread-view{display:none}
  main[data-view="thread"] .side{display:none}
  .back{display:inline-block}
  h1{font-size:24px}
}
@media (prefers-reduced-motion:no-preference){
  .thread-item,.btn,.ghost{transition:background .12s,border-color .12s,color .12s}
}
body{margin:0}
[hidden]{display:none !important}
.notice.ok{background:var(--accent-soft);color:var(--accent)}
.top-right{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.who{font-size:13px;font-weight:700;overflow-wrap:anywhere}
.acct .ghost,.gate .ghost{padding:4px 12px;font-size:13px}
.acct .btn{padding:4px 14px;font-size:13px}
.gate{padding:14px;display:flex;flex-direction:column;gap:10px}
.gate p{margin:0;font-size:14px}
.mypage{max-width:720px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.section{padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.section h2{margin:0;font-size:15px;letter-spacing:.06em}
.section p{margin:0;font-size:14px}
.section .kv{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.mp-row{display:flex;align-items:center;gap:8px;padding-right:12px;flex-wrap:wrap}
.mp-row .thread-item{flex:1;min-width:0}
.mp-actions{display:flex;gap:6px;flex-shrink:0}
.badge{display:inline-block;font-size:11px;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:0 6px;margin-right:6px;vertical-align:1px}
.snippet{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.danger-zone{border-color:var(--danger)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
@media (max-width:760px){.top-right{width:100%}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>みんなの掲示板</h1>
    <div class="top-right">
      <span class="sub" id="status">読み込み中…</span>
      <nav class="acct" id="acct" aria-label="アカウント"></nav>
    </div>
  </header>
  <div class="notice" id="notice" hidden></div>
  <main id="main" data-view="list">
    <aside class="side">
      <section class="panel">
        <div class="list-head">スレッド一覧</div>
        <ul class="threads" id="threads"></ul>
      </section>
      <div id="newGate" hidden></div>
      <form class="panel compose" id="newForm">
        <h2>新しいスレッドを立てる</h2>
        <div><label for="nt-title">スレッドのタイトル</label><input type="text" id="nt-title" maxlength="80" required></div>
        <div id="nt-name-wrap"><label for="nt-name">名前</label><input type="text" id="nt-name" maxlength="30" placeholder="名無しさん"></div>
        <p class="sub" id="nt-as" hidden></p>
        <div><label for="nt-body">最初の書き込み</label><textarea id="nt-body" maxlength="2000" required></textarea></div>
        <div class="row"><button class="btn" type="submit">スレッドを立てる</button></div>
      </form>
    </aside>
    <section class="thread-view" id="view">
      <div class="panel placeholder" id="placeholder">左の一覧からスレッドを選んでください。</div>
    </section>
  </main>

  <section id="myPage" hidden>
    <div class="mypage">
      <form class="panel section" id="profileForm">
        <h2>プロフィール</h2>
        <div class="kv">メールアドレス: <span id="mp-email"></span></div>
        <div><label for="mp-name">表示名</label><input type="text" id="mp-name" maxlength="30" autocomplete="nickname"></div>
        <div class="row"><button class="btn" type="submit">保存</button></div>
      </form>
      <div class="panel">
        <div class="list-head">自分が立てたスレッド</div>
        <ul class="threads" id="mp-threads"></ul>
      </div>
      <div class="panel">
        <div class="list-head">書き込み履歴</div>
        <ul class="threads" id="mp-history"></ul>
      </div>
      <div class="panel section danger-zone" id="mp-withdraw"></div>
    </div>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.min.js" integrity="sha384-JBR+x8blGwjDRO63aHCGiZMD4VNiTR4ZUGA+N6ZKLf3zNt1fK8IBpcgPaMrxqWBp" crossorigin="anonymous"></script>
<script>
(function(){
  /* Supabase の「Project Settings > API」にある Project URL と anon(publishable)キーを設定します。
     どちらも公開前提の値です(アクセス制御は RLS が担当)。空のままだとブラウザ内保存で動きます。 */
  var SUPABASE_URL = "https://ygubxmuxsojbuvzqzjrh.supabase.co";
  var SUPABASE_KEY = "sb_publishable_KFBsbW-xAAtsRYMlPrjxOQ_hgH2hEwq";

  var DEFAULT_NAME = "名無しさん";
  var $ = function(id){ return document.getElementById(id); };

  function h(tag, attrs){
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs){
      if (k === "text") el.textContent = attrs[k];
      else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== false && attrs[k] != null) el.setAttribute(k, attrs[k] === true ? "" : attrs[k]);
    }
    for (var i = 2; i < arguments.length; i++){
      var c = arguments[i];
      if (c == null || c === false) continue;
      el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }
  function fmt(ts){
    var d = new Date(ts), p = function(n){ return String(n).padStart(2,"0"); };
    return d.getFullYear() + "/" + p(d.getMonth()+1) + "/" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
  }
  function getName(){ try { return localStorage.getItem("bbs-name") || ""; } catch(e){ return ""; } }
  function saveName(v){ try { localStorage.setItem("bbs-name", v); } catch(e){} }

  /* ---- in-memory fallback with the same call shape as the db capability ---- */
  function makeMem(){
    var KEY = "bbs-data-v1", cols = {}, subs = {};
    function load(){
      try {
        var raw = JSON.parse(localStorage.getItem(KEY) || "null");
        cols = {};
        if (raw) Object.keys(raw).forEach(function(p){ cols[p] = new Map(raw[p]); });
        return !!raw;
      } catch(e){ return false; }
    }
    function persist(){
      try {
        var o = {};
        Object.keys(cols).forEach(function(p){ o[p] = Array.from(cols[p].entries()); });
        localStorage.setItem(KEY, JSON.stringify(o));
      } catch(e){}
    }
    function notifyAll(){ Object.keys(subs).forEach(function(p){ (subs[p] || []).slice().forEach(function(f){ f(); }); }); }
    var hadData = load();
    window.addEventListener("storage", function(e){ if (e.key === KEY){ load(); notifyAll(); } });
    function notify(p){ persist(); (subs[p] || []).slice().forEach(function(f){ f(); }); }
    function col(path){
      var rows = function(){ return cols[path] || (cols[path] = new Map()); };
      function snap(o){
        var docs = Array.from(rows().entries()).map(function(e){ return { id:e[0], exists:true, data:function(){ return e[1]; } }; });
        if (o) docs.sort(function(a,b){ var x=a.data()[o.f], y=b.data()[o.f]; return (x<y?-1:x>y?1:0) * (o.d==="desc"?-1:1); });
        return { docs:docs, size:docs.length, empty:!docs.length };
      }
      function mk(o){
        return {
          orderBy:function(f,d){ return mk({f:f,d:d||"asc"}); },
          get:function(){ return Promise.resolve(snap(o)); },
          onSnapshot:function(next){
            var fn = function(){ next(snap(o)); };
            (subs[path] = subs[path] || []).push(fn); setTimeout(fn, 0);
            return function(){ subs[path] = subs[path].filter(function(x){ return x !== fn; }); };
          }
        };
      }
      var ref = mk(null);
      ref.doc = function(id){
        id = id || ("m" + Math.random().toString(36).slice(2,10));
        return {
          id:id,
          set:function(d){ rows().set(id, Object.assign({}, d)); notify(path); return Promise.resolve(); },
          update:function(d){ rows().set(id, Object.assign({}, rows().get(id), d)); notify(path); return Promise.resolve(); },
          delete:function(){ rows().delete(id); notify(path); return Promise.resolve(); },
          collection:function(s){ return col(path + "/" + id + "/" + s); }
        };
      };
      ref.add = function(d){ var r = ref.doc(); return r.set(d).then(function(){ return r; }); };
      return ref;
    }
    return { collection:col, hadData:hadData };
  }

  /* ---- Supabase adapter with the same call shape as the db capability ----
     "threads" -> table threads, "threads/<id>/replies" -> table replies filtered by thread_id */
  function makeSupabase(client){
    var subs = [], seq = 0;
    function snake(k){ return k.replace(/[A-Z]/g, function(c){ return "_" + c.toLowerCase(); }); }
    function camel(k){ return k.replace(/_([a-z])/g, function(_, c){ return c.toUpperCase(); }); }
    function mapKeys(o, f){ var r = {}; Object.keys(o).forEach(function(k){ r[f(k)] = o[k]; }); return r; }
    function check(res){ if (res.error) throw res.error; return res.data; }
    function uuid(){
      var b = crypto.getRandomValues(new Uint8Array(16));
      b[6] = (b[6] & 15) | 64; b[8] = (b[8] & 63) | 128;
      var x = Array.from(b, function(n){ return n.toString(16).padStart(2, "0"); }).join("");
      return x.slice(0,8) + "-" + x.slice(8,12) + "-" + x.slice(12,16) + "-" + x.slice(16,20) + "-" + x.slice(20);
    }
    // resolves once every live subscriber on the table has re-read, so callers see their own write
    function refresh(table){
      return Promise.all(subs.filter(function(s){ return s.table === table; }).map(function(s){ return s.fn(); }));
    }
    function col(path){
      var p = path.split("/");
      var table = p.length === 3 ? p[2] : p[0], parent = p.length === 3 ? p[1] : null;
      function query(o){
        var q = client.from(table).select("*");
        if (parent) q = q.eq("thread_id", parent);
        if (o) q = q.order(snake(o.f), { ascending: o.d !== "desc" });
        return q.then(check);
      }
      function snap(rows){
        var docs = rows.map(function(r){
          var d = mapKeys(r, camel); delete d.id; delete d.threadId;
          return { id:r.id, exists:true, data:function(){ return d; } };
        });
        return { docs:docs, size:docs.length, empty:!docs.length };
      }
      function row(id, d){
        var r = mapKeys(d, snake); r.id = id;
        if (parent) r.thread_id = parent;
        return r;
      }
      function mk(o){
        return {
          orderBy:function(f,d){ return mk({f:f,d:d||"asc"}); },
          get:function(){ return query(o).then(snap); },
          onSnapshot:function(next, onErr){
            var alive = true;
            var fn = function(){
              return query(o).then(function(rows){ if (alive) next(snap(rows)); })
                .catch(function(e){ if (alive && onErr) onErr(e); });
            };
            var entry = { table:table, fn:fn };
            subs.push(entry);
            var ch = client.channel("bbs-" + table + "-" + (++seq))
              .on("postgres_changes", { event:"*", schema:"public", table:table }, fn)
              .subscribe();
            fn();
            return function(){ alive = false; subs = subs.filter(function(s){ return s !== entry; }); client.removeChannel(ch); };
          }
        };
      }
      var ref = mk(null);
      ref.doc = function(id){
        id = id || uuid();
        function done(){ return refresh(table); }
        return {
          id:id,
          set:function(d){ return client.from(table).upsert(row(id, d)).then(check).then(done); },
          update:function(d){ return client.from(table).update(mapKeys(d, snake)).eq("id", id).then(check).then(done); },
          delete:function(){ return client.from(table).delete().eq("id", id).then(check).then(done); },
          collection:function(s){ return col(path + "/" + id + "/" + s); }
        };
      };
      ref.add = function(d){
        var r = ref.doc();
        return client.from(table).insert(row(r.id, d)).then(check).then(function(){ return refresh(table); }).then(function(){ return r; });
      };
      return ref;
    }
    return { collection:col };
  }

  /* ---- state ---- */
  var db = null, memMode = false;
  var threads = [], replies = [], selectedId = null;
  var editing = null;      // {id, title, body}
  var armed = null;        // id awaiting delete confirmation
  var unsubReplies = null;
  var busy = false;
  var client = null;                    // Supabase client (null in browser-local mode)
  var user = null;                      // {id, email, displayName} when logged in
  var authReady = false, prevUserId = null;
  var page = "board";
  var myReplies = [], wdArmed = false, stickyNotice = false;   // stickyNotice: keep the notice across the next page change

  function say(msg, ok){
    var n = $("notice");
    if (!msg){ n.hidden = true; return; }
    n.textContent = msg; n.className = ok ? "notice ok" : "notice"; n.hidden = false;
  }
  function fail(e){
    var c = e && e.code;
    if (c === "quota_exceeded") say("保存できる件数の上限に達しました。古いスレッドを削除してからもう一度お試しください。");
    else if (c === "invalid_argument" || c === "42501" || c === "PGRST301" || c === "PGRST303") say("この操作にはログインが必要か、権限がありません。ログインし直してからお試しください。");
    else say("保存できませんでした。少し待ってからもう一度お試しください。");
  }
  // browser-local mode has no accounts: everyone may write and edit
  function canWrite(){ return memMode || !!user; }
  function canModify(p){ return memMode || !!(user && p.userId && p.userId === user.id); }
  function run(fn){
    if (busy) return Promise.resolve();
    busy = true; say("");
    return Promise.resolve().then(fn).catch(fail).then(function(){ busy = false; });
  }

  /* ---- rendering ---- */
  function renderList(){
    var ul = $("threads");
    ul.textContent = "";
    if (!threads.length){
      ul.appendChild(h("li", { class:"empty", text:"まだスレッドがありません。最初のスレッドを立ててみましょう。" }));
      return;
    }
    threads.forEach(function(t){
      ul.appendChild(h("li", null,
        h("button", { type:"button", class:"thread-item", "aria-current": t.id === selectedId ? "true" : "false", onclick:function(){ select(t.id); } },
          h("span", { class:"t", text:t.title }),
          h("span", { class:"m", text:(t.name || DEFAULT_NAME) + " ・ 最終更新 " + fmt(t.updatedAt || t.createdAt) })
        )));
    });
  }

  function postNode(no, p, kind){
    var isEditing = editing && editing.id === p.id && editing.kind === kind;
    var meta = h("div", { class:"post-meta" },
      h("span", { class:"no", text:"#" + no }),
      h("span", { class:"name", text:p.name || DEFAULT_NAME }),
      h("span", { class:"time", text:fmt(p.createdAt) }),
      p.editedAt ? h("span", { class:"edited", text:"(編集済)" }) : null
    );
    var actions = h("div", { class:"actions" });
    var content;
    if (isEditing){
      var ti = null;
      if (kind === "thread"){
        ti = h("input", { type:"text", id:"edit-title", maxlength:"80", value:editing.title, "aria-label":"スレッドのタイトル",
          oninput:function(e){ editing.title = e.target.value; } });
      }
      var ta = h("textarea", { id:"edit-body", maxlength:"2000", "aria-label":"書き込みの内容", oninput:function(e){ editing.body = e.target.value; } });
      ta.value = editing.body;
      content = h("div", { class:"edit-form" }, ti, ta,
        h("div", { class:"row" },
          h("button", { type:"button", class:"btn", onclick:function(){ saveEdit(kind, p); } }, "保存"),
          h("button", { type:"button", class:"ghost", onclick:function(){ editing = null; renderView(); } }, "キャンセル")));
    } else {
      content = h("p", { class:"body", text:p.body });
      if (canModify(p)){
        actions.appendChild(h("button", { type:"button", class:"ghost", onclick:function(){
          armed = null; editing = { id:p.id, kind:kind, title:p.title || "", body:p.body }; renderView();
          var f = $("edit-body"); if (f) f.focus();
        } }, "編集"));
        var isArmed = armed === p.id;
        actions.appendChild(h("button", { type:"button", class:"ghost danger" + (isArmed ? " armed" : ""), onclick:function(){
          if (armed === p.id){ removePost(kind, p); } else { armed = p.id; renderView(); }
        } }, isArmed ? (kind === "thread" ? "スレッドごと削除する" : "本当に削除する") : "削除"));
        if (isArmed) actions.appendChild(h("button", { type:"button", class:"ghost", onclick:function(){ armed = null; renderView(); } }, "やめる"));
      }
    }
    if (!isEditing && actions.childNodes.length) meta.appendChild(actions);
    return h("li", { class:"post" }, meta, content);
  }

  function gate(msg){
    return h("div", { class:"panel gate" },
      h("p", { text:msg }),
      h("div", { class:"row" }, h("button", { type:"button", class:"btn", onclick:startLogin }, "Google でログイン")));
  }
  // "投稿者: <name> [表示名を変更]" — the default display name is not taken from the Google profile
  function authorNodes(){
    return [document.createTextNode("投稿者: " + user.displayName + " "),
      h("button", { type:"button", class:"ghost", onclick:function(){ go("mypage"); } }, "表示名を変更")];
  }

  function renderView(){
    var view = $("view");
    var t = threads.filter(function(x){ return x.id === selectedId; })[0];
    view.textContent = "";
    if (!t){
      view.appendChild(h("div", { class:"panel placeholder", text: selectedId ? "このスレッドは削除されました。" : "左の一覧からスレッドを選んでください。" }));
      if (selectedId){ selectedId = null; }
      return;
    }
    var back = h("button", { type:"button", class:"ghost back", onclick:function(){ $("main").dataset.view = "list"; } }, "← スレッド一覧へ");
    var head = h("div", { class:"panel thread-head" },
      back,
      h("h2", { text:t.title }),
      h("span", { class:"sub", text:"書き込み " + (replies.length + 1) + " 件" })
    );
    var list = h("ol", { class:"posts", style:"list-style:none;margin:0;padding:0" });
    list.appendChild(postNode(1, Object.assign({}, t), "thread"));
    replies.forEach(function(r, i){ list.appendChild(postNode(i + 2, r, "reply")); });

    var form;
    if (canWrite()){
      var nameIn = memMode ? h("input", { type:"text", id:"rp-name", maxlength:"30", placeholder:DEFAULT_NAME, value:getName() }) : null;
      var bodyIn = h("textarea", { id:"rp-body", maxlength:"2000", required:true });
      form = h("form", { class:"panel compose", id:"replyForm", onsubmit:function(e){
        e.preventDefault();
        var name = memMode ? nameIn.value.trim() : user.displayName, body = bodyIn.value.trim();
        if (!body) return;
        if (memMode) saveName(name);
        run(function(){
          var now = Date.now();
          return repliesCol(t.id).add({ name:name, body:body, createdAt:now }).then(function(){
            bodyIn.value = "";
            // with Supabase the thread's updated_at is bumped by a DB trigger (repliers don't own the thread)
            if (memMode) return db.collection("threads").doc(t.id).update({ updatedAt:now });
          });
        });
      } },
        h("h2", { text:"書き込む" }),
        memMode ? h("div", null, h("label", { for:"rp-name", text:"名前" }), nameIn) : h.apply(null, ["p", { class:"sub" }].concat(authorNodes())),
        h("div", null, h("label", { for:"rp-body", text:"書き込みの内容" }), bodyIn),
        h("div", { class:"row" }, h("button", { class:"btn", type:"submit" }, "書き込む"))
      );
    } else {
      form = gate("返信するにはログインが必要です。");
    }
    view.appendChild(head);
    view.appendChild(h("div", { class:"panel" }, list));
    view.appendChild(form);
  }

  /* ---- data ---- */
  function repliesCol(id){ return db.collection("threads").doc(id).collection("replies"); }

  function select(id){
    if (selectedId === id){ $("main").dataset.view = "thread"; return; }
    if (unsubReplies){ unsubReplies(); unsubReplies = null; }
    selectedId = id; replies = []; editing = null; armed = null;
    $("main").dataset.view = "thread";
    renderList(); renderView();
    unsubReplies = repliesCol(id).orderBy("createdAt", "asc").onSnapshot(function(snap){
      if (selectedId !== id) return;
      replies = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
      // keep the reply draft the viewer is typing
      var f = $("rp-body"), keep = f ? f.value : "", kn = $("rp-name") ? $("rp-name").value : "";
      var focused = document.activeElement && document.activeElement.id;
      if (editing && (focused === "edit-body" || focused === "edit-title")) return;
      renderView();
      if ($("rp-body")){ $("rp-body").value = keep; if ($("rp-name")) $("rp-name").value = kn; if (focused === "rp-body") $("rp-body").focus(); }
    }, fail);
  }

  function saveEdit(kind, p){
    var body = editing.body.trim();
    if (!body) return;
    var patch = { body:body, editedAt:Date.now() };
    if (kind === "thread"){
      var title = editing.title.trim();
      if (!title) return;
      patch.title = title;
    }
    run(function(){
      var ref = kind === "thread" ? db.collection("threads").doc(p.id) : repliesCol(selectedId).doc(p.id);
      return ref.update(patch).then(function(){ editing = null; renderView(); });
    });
  }

  function removePost(kind, p){
    run(function(){
      armed = null;
      if (kind === "reply") return repliesCol(selectedId).doc(p.id).delete();
      var tid = p.id;
      // in Supabase, replies (including other people's) go with the thread via ON DELETE CASCADE
      if (!memMode) return db.collection("threads").doc(tid).delete().then(function(){ $("main").dataset.view = "list"; });
      return repliesCol(tid).get().then(function(s){
        return Promise.all(s.docs.map(function(d){ return repliesCol(tid).doc(d.id).delete(); }));
      }).then(function(){
        return db.collection("threads").doc(tid).delete();
      }).then(function(){
        $("main").dataset.view = "list";
      });
    });
  }

  /* ---- pages: board / my page (hash routing) ---- */
  function go(to){ if (location.hash === "#" + to) route(); else location.hash = to; }
  function redirect(to){
    try { history.replaceState(null, "", "#" + to); route(); } catch(e){ location.hash = to; }
  }
  function route(){
    var hash = location.hash.replace(/^#/, ""), want = "board";
    if (!memMode && hash === "mypage") want = "mypage";
    if (want === "mypage" && authReady && !user){
      redirect("board");
      say("マイページを見るにはログインしてください。");
      return;
    }
    if (want === "mypage" && !authReady) want = "wait";     // session still being restored
    var changed = want !== page;
    if (changed){ if (stickyNotice) stickyNotice = false; else say(""); }
    page = want;
    $("main").hidden = want !== "board";
    $("myPage").hidden = want !== "mypage";
    if (changed){
      if (want === "mypage"){ wdArmed = false; renderMyPage(); loadHistory(); }
      window.scrollTo(0, 0);
    }
    renderAccount();
  }
  function openThread(id){ go("board"); select(id); }

  function renderAccount(){
    var box = $("acct");
    box.textContent = "";
    if (memMode || !authReady) return;
    var ghost = function(label, fn){ return h("button", { type:"button", class:"ghost", onclick:fn }, label); };
    if (user){
      box.appendChild(h("span", { class:"who", text:user.displayName + " さん" }));
      if (page !== "board") box.appendChild(ghost("掲示板", function(){ go("board"); }));
      if (page !== "mypage") box.appendChild(ghost("マイページ", function(){ go("mypage"); }));
      box.appendChild(ghost("ログアウト", logout));
    } else {
      box.appendChild(h("button", { type:"button", class:"btn", onclick:startLogin }, "Google でログイン"));
    }
  }

  function renderCompose(){
    var can = canWrite(), gateBox = $("newGate");
    $("newForm").hidden = !can;
    gateBox.textContent = "";
    gateBox.hidden = can;
    if (!can) gateBox.appendChild(gate("スレッドを立てるにはログインが必要です。"));
    $("nt-name-wrap").hidden = !memMode;
    $("nt-as").hidden = memMode || !user;
    $("nt-as").textContent = "";
    if (user) authorNodes().forEach(function(n){ $("nt-as").appendChild(n); });
  }

  /* ---- auth (Google) ---- */
  function siteUrl(){ return /^https?:/.test(location.href) ? location.origin + location.pathname : undefined; }
  function startLogin(){
    if (!client) return;
    say("");
    // the browser goes to Google and comes back here with a session, which supabase-js picks up from the URL
    client.auth.signInWithOAuth({ provider:"google", options:{ redirectTo:siteUrl() } }).then(function(res){
      if (res.error) throw res.error;
    }).catch(function(){ say("Google ログインを開始できませんでした。時間をおいてもう一度お試しください。"); });
  }

  function logout(){
    client.auth.signOut().catch(function(){}).then(function(){ go("board"); });
  }

  function applySession(session){
    var u = session && session.user;
    if (!u){ user = null; authReady = true; return afterAuth(); }
    var fallback = "ユーザー";
    return client.from("profiles").select("display_name").eq("id", u.id).maybeSingle().then(function(res){
      return (res.data && res.data.display_name) || fallback;
    }, function(){ return fallback; }).then(function(name){
      user = { id:u.id, email:u.email, displayName:name };
      authReady = true; afterAuth();
    });
  }
  function afterAuth(){
    var id = user ? user.id : null, changed = id !== prevUserId;
    prevUserId = id;
    renderCompose();
    if (changed){ myReplies = []; editing = null; armed = null; wdArmed = false; renderView(); }
    route();
  }

  /* ---- my page ---- */
  function loadHistory(){
    if (!client || !user) return Promise.resolve();
    return client.from("replies").select("thread_id, body, created_at").eq("user_id", user.id)
      .order("created_at", { ascending:false }).limit(200).then(function(res){
        if (res.error) throw res.error;
        myReplies = res.data || [];
        if (page === "mypage") renderMyPage();
      }).catch(fail);
  }

  function renderMyPage(){
    if (!user) return;
    var nm = $("mp-name");
    if (document.activeElement !== nm) nm.value = user.displayName;
    $("mp-email").textContent = user.email || "";

    var mine = threads.filter(function(t){ return t.userId === user.id; });
    var ul = $("mp-threads");
    ul.textContent = "";
    if (!mine.length) ul.appendChild(h("li", { class:"empty", text:"まだスレッドを立てていません。" }));
    mine.forEach(function(t){
      var isArmed = armed === t.id;
      ul.appendChild(h("li", { class:"mp-row" },
        h("button", { type:"button", class:"thread-item", onclick:function(){ openThread(t.id); } },
          h("span", { class:"t", text:t.title }),
          h("span", { class:"m", text:"作成 " + fmt(t.createdAt) + " ・ 最終更新 " + fmt(t.updatedAt || t.createdAt) })),
        h("div", { class:"mp-actions" },
          h("button", { type:"button", class:"ghost danger" + (isArmed ? " armed" : ""), onclick:function(){
            if (armed === t.id){ removePost("thread", t); } else { armed = t.id; renderMyPage(); }
          } }, isArmed ? "スレッドごと削除する" : "削除"),
          isArmed ? h("button", { type:"button", class:"ghost", onclick:function(){ armed = null; renderMyPage(); } }, "やめる") : null)));
    });

    var items = mine.map(function(t){ return { kind:"スレッド", id:t.id, title:t.title, body:t.body, at:t.createdAt }; });
    myReplies.forEach(function(r){
      var t = threads.filter(function(x){ return x.id === r.thread_id; })[0];
      if (t) items.push({ kind:"返信", id:t.id, title:t.title, body:r.body, at:r.created_at });
    });
    items.sort(function(a, b){ return b.at - a.at; });
    var hl = $("mp-history");
    hl.textContent = "";
    if (!items.length) hl.appendChild(h("li", { class:"empty", text:"まだ書き込みがありません。" }));
    items.slice(0, 100).forEach(function(it){
      hl.appendChild(h("li", null,
        h("button", { type:"button", class:"thread-item", onclick:function(){ openThread(it.id); } },
          h("span", { class:"t" }, h("span", { class:"badge", text:it.kind }), it.title),
          h("span", { class:"m snippet", text:fmt(it.at) + " ・ " + it.body.replace(/\s+/g, " ") }))));
    });

    var w = $("mp-withdraw");
    w.textContent = "";
    w.appendChild(h("h2", { text:"退会" }));
    w.appendChild(h("p", { text: wdArmed
      ? "アカウントと、あなたが立てたスレッド(他の人の返信も含む)、あなたの書き込みがすべて削除されます。元に戻せません。"
      : "アカウントと書き込みをすべて削除します。" }));
    w.appendChild(wdArmed
      ? h("div", { class:"row" },
          h("button", { type:"button", class:"btn danger", onclick:withdraw }, "本当に退会する"),
          h("button", { type:"button", class:"ghost", onclick:function(){ wdArmed = false; renderMyPage(); } }, "やめる"))
      : h("div", { class:"row" }, h("button", { type:"button", class:"ghost danger", onclick:function(){ wdArmed = true; renderMyPage(); } }, "退会する")));
  }

  $("profileForm").addEventListener("submit", function(e){
    e.preventDefault();
    if (!user) return;
    var v = $("mp-name").value.trim();
    if (!v){ say("表示名を入力してください。"); return; }
    if (v === user.displayName){ say("表示名は変わっていません。", true); return; }
    say("");
    client.from("profiles").update({ display_name:v }).eq("id", user.id).select("display_name").then(function(res){
      if (res.error) throw res.error;
      if (!res.data || !res.data.length) throw new Error("no row updated");
      user.displayName = v;                 // past posts follow via a DB trigger and arrive through realtime
      renderAccount(); renderCompose(); renderView();
      say("表示名を変更しました。", true);
    }).catch(function(){ say("表示名を変更できませんでした。時間をおいてもう一度お試しください。"); });
  });

  function withdraw(){
    run(function(){
      return client.rpc("delete_my_account").then(function(res){
        if (res.error) throw res.error;
        return client.auth.signOut({ scope:"local" });
      }).then(function(){
        wdArmed = false; stickyNotice = true; go("board");
        say("退会しました。ご利用ありがとうございました。", true);
      });
    });
  }

  $("nt-name").value = getName();
  $("newForm").addEventListener("submit", function(e){
    e.preventDefault();
    if (!canWrite()) return;
    var title = $("nt-title").value.trim(), name = memMode ? $("nt-name").value.trim() : user.displayName, body = $("nt-body").value.trim();
    if (!title || !body) return;
    if (memMode) saveName(name);
    run(function(){
      var now = Date.now();
      return db.collection("threads").add({ title:title, name:name, body:body, createdAt:now, updatedAt:now }).then(function(ref){
        $("nt-title").value = ""; $("nt-body").value = "";
        select(ref.id);
      });
    });
  });

  function start(){
    $("status").textContent = memMode ? "この端末のブラウザに保存されます" : "みんなで共有されています";
    if (memMode && !db.hadData){
      var now = Date.now();
      var t = db.collection("threads");
      t.doc("s1").set({ title:"はじめての書き込み", name:"管理人", body:"ここは自由に使える掲示板です。名前を入れて書き込めます。\n書き込みの右上から編集・削除ができます。", createdAt:now-7200000, updatedAt:now-3600000 });
      t.doc("s1").collection("replies").doc("r1").set({ name:"通りすがり", body:"よろしくお願いします。", createdAt:now-3600000 });
    }
    db.collection("threads").orderBy("updatedAt", "desc").onSnapshot(function(snap){
      threads = snap.docs.map(function(d){ return Object.assign({ id:d.id }, d.data()); });
      renderList();
      if (page === "mypage") renderMyPage();
      if (selectedId) {
        var f = document.activeElement && document.activeElement.id;
        if (f === "rp-body" || f === "edit-body" || f === "edit-title") return;
        var exists = threads.some(function(x){ return x.id === selectedId; });
        if (!exists){ if (unsubReplies){ unsubReplies(); unsubReplies = null; } $("main").dataset.view = "list"; }
        renderView();
        if (!exists) selectedId = null;
      } else if (threads.length && window.matchMedia("(min-width:761px)").matches){
        select(threads[0].id);
      }
    }, fail);
  }

  renderList();
  if (SUPABASE_URL && SUPABASE_KEY && window.supabase){
    client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    db = makeSupabase(client);
  } else {
    if (SUPABASE_URL && SUPABASE_KEY) say("Supabase に接続できなかったため、この端末のブラウザ内だけで動作しています。");
    db = makeMem(); memMode = true;
  }
  start();
  if (client){
    // defer: supabase-js must not be called from inside its own auth callback
    client.auth.onAuthStateChange(function(event, session){ setTimeout(function(){ applySession(session); }, 0); });
  } else {
    authReady = true;
  }
  window.addEventListener("hashchange", route);
  renderCompose(); renderAccount();
  if (client && /[#&?]error(_code)?=/.test(location.hash + location.search)){
    // the round trip to Google failed or was cancelled (the error comes back in the URL)
    redirect("board");
    say("ログインできませんでした。もう一度お試しください。");
  } else {
    route();
  }
})();
</script>
</body>
</html>
